<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#6B8E23">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bitácora">
<title>Bitácora Avícola</title>
<script src="https://cdn.jsdelivr.net/npm/dexie@4.0.8/dist/dexie.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --primary:#6B8E23; --primary-dark:#4A6318; --primary-light:#8FBF3F;
  --accent:#F5C542;
  --bg:#FAFAF7; --card:#FFFFFF; --card2:#F5F5F0;
  --text:#2D2D2D; --text2:#6E6E6E; --text3:#A0A0A0;
  --success:#4CAF50; --warning:#FF9800; --danger:#E53935;
  --border:#E5E5E0;
  --shadow:0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-lg:0 8px 24px rgba(0,0,0,.12);
  --radius:12px; --radius-sm:8px; --radius-lg:20px;
}
[data-theme="dark"]{
  --primary:#8FBF3F; --primary-dark:#6B8E23; --primary-light:#A5D060;
  --bg:#141414; --card:#1F1F1F; --card2:#2A2A2A;
  --text:#F0F0F0; --text2:#A0A0A0; --text3:#707070;
  --border:#2F2F2F;
  --shadow:0 1px 3px rgba(0,0,0,.4);
  --shadow-lg:0 8px 24px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;height:100dvh;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.4;overscroll-behavior:none;user-select:none}
input,textarea{user-select:text}
#app{max-width:520px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0;z-index:20}
.header h1{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.header h1 .logo{font-size:20px}
.header .hbtns{display:flex;gap:4px;align-items:center}
.hbtn{width:38px;height:38px;border-radius:10px;border:none;background:transparent;color:var(--text);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.hbtn:active{background:var(--border)}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--text3);margin-right:6px;transition:.3s}
.sync-dot.on{background:var(--success);box-shadow:0 0 8px rgba(76,175,80,.6)}
.sync-dot.syncing{background:var(--warning);animation:pulse 1s infinite}
.sync-dot.err{background:var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.main{flex:1;overflow-y:auto;padding:14px 16px 110px;-webkit-overflow-scrolling:touch}
.main::-webkit-scrollbar{width:0}
.lote-card{background:var(--card);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);margin-bottom:12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border);transition:.15s}
.lote-card:active{transform:scale(.985)}
.lote-card .info h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px}
.lote-card .info .dot{width:8px;height:8px;border-radius:50%;background:var(--success);display:inline-block}
.lote-card .info .dot.warn{background:var(--warning)}
.lote-card .info .dot.danger{background:var(--danger)}
.lote-card .info p{font-size:12.5px;color:var(--text2);margin-top:3px}
.lote-card .chev{color:var(--text3);font-size:20px}
.progress-card{background:var(--card);border-radius:var(--radius);padding:12px 16px;box-shadow:var(--shadow);margin-bottom:14px;border:1px solid var(--border)}
.progress-card .lbl{font-size:12px;color:var(--text2);margin-bottom:8px;display:flex;justify-content:space-between;font-weight:500}
.progress-card .lbl b{color:var(--primary)}
.progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.progress-bar span{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-light));border-radius:3px;transition:width .5s ease}
.section-card{background:var(--card);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);margin-bottom:10px;cursor:pointer;border:1px solid var(--border);border-left:4px solid var(--border);transition:transform .12s, border-color .2s}
.section-card:active{transform:scale(.985)}
.section-card.ok{border-left-color:var(--success)}
.section-card.pending{border-left-color:var(--warning)}
.section-card.alert{border-left-color:var(--danger)}
.section-card .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.section-card .title{font-size:15px;font-weight:600;display:flex;align-items:center;gap:10px}
.section-card .title .ic{font-size:20px}
.section-card .status{font-size:18px}
.section-card .summary{font-size:13px;color:var(--text2);margin-top:5px;padding-left:30px}
.quick-card{background:var(--card);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);margin-bottom:10px;border:1px solid var(--border)}
.quick-card h4{font-size:12px;color:var(--text2);font-weight:600;margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quick-btn{padding:12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:13.5px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:6px;justify-content:center;transition:.12s}
.quick-btn:active{background:var(--border);transform:scale(.97)}
.reminder{background:#FFF8E1;border-left:4px solid var(--warning);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px;font-size:13px;display:flex;gap:10px;align-items:center;cursor:pointer}
[data-theme="dark"] .reminder{background:#3A2E10}
.reminder.crit{background:#FFEBEE;border-left-color:var(--danger)}
[data-theme="dark"] .reminder.crit{background:#3A1010}
.reminder .ic{font-size:16px}
.reminder .txt{flex:1}
.reminder .txt b{display:block;font-weight:600;margin-bottom:2px}
.reminder .txt span{font-size:12px;color:var(--text2)}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:var(--card);border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;padding:6px 0 8px;padding-bottom:calc(8px + env(safe-area-inset-bottom));z-index:30;box-shadow:0 -2px 8px rgba(0,0,0,.04)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:var(--text3);font-size:10.5px;cursor:pointer;padding:4px 2px;font-weight:500;transition:.15s}
.nav-item .ic{font-size:20px;line-height:1;transition:.2s}
.nav-item.active{color:var(--primary)}
.nav-item.active .ic{transform:scale(1.15)}
.nav-plus{width:54px;height:54px;border-radius:50%;background:var(--primary);color:#fff;border:none;font-size:26px;cursor:pointer;box-shadow:0 4px 12px rgba(107,142,35,.4);display:flex;align-items:center;justify-content:center;margin-top:-22px;transition:.15s;flex-shrink:0}
.nav-plus:active{transform:scale(.92) rotate(90deg)}
.screen{position:fixed;inset:0;background:var(--bg);z-index:40;display:none;flex-direction:column;max-width:520px;margin:0 auto;animation:slideUp .22s ease}
.screen.open{display:flex}
@keyframes slideUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
.screen-header{display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0}
.screen-header .back{width:38px;height:38px;border-radius:10px;border:none;background:transparent;color:var(--text);font-size:20px;cursor:pointer;flex-shrink:0}
.screen-header .back:active{background:var(--border)}
.screen-header h2{font-size:16px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.screen-header .action{font-size:12.5px;color:var(--primary);background:none;border:none;cursor:pointer;font-weight:600;padding:6px 10px;border-radius:8px}
.screen-header .action:active{background:var(--card2)}
.screen-body{flex:1;overflow-y:auto;padding:16px 16px 120px}
.field{margin-bottom:16px}
.field>label{font-size:12.5px;color:var(--text2);font-weight:600;display:block;margin-bottom:7px;text-transform:uppercase;letter-spacing:.3px}
.input-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.input-row.two{grid-template-columns:1fr 1fr}
.input-row.one{grid-template-columns:1fr}
.num-input{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 8px;text-align:center;transition:.15s}
.num-input:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px rgba(107,142,35,.12)}
.num-input .cap{font-size:10.5px;color:var(--text3);margin-bottom:3px;font-weight:500}
.num-input input{width:100%;border:none;background:transparent;color:var(--text);font-size:17px;font-weight:700;text-align:center;outline:none;font-variant-numeric:tabular-nums}
.num-input input::placeholder{color:var(--text3);font-weight:400;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px}
.chip{padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px;cursor:pointer;white-space:nowrap;transition:.15s;font-weight:500}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 2px 6px rgba(107,142,35,.25)}
[data-theme="dark"] .chip.on{color:#141414}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.check{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:13px;transition:.15s}
.check.on{background:var(--primary);color:#fff;border-color:var(--primary)}
[data-theme="dark"] .check.on{color:#141414}
.check .box{width:18px;height:18px;border-radius:4px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.check.on .box{background:#fff;color:var(--primary);border-color:#fff}
.save-btn{width:100%;padding:14px;border-radius:var(--radius-sm);border:none;background:var(--primary);color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px;transition:.15s;box-shadow:0 2px 8px rgba(107,142,35,.2)}
.save-btn:active{background:var(--primary-dark);transform:scale(.98)}
[data-theme="dark"] .save-btn{color:#141414}
.save-btn.ghost{background:transparent;color:var(--primary);border:1.5px solid var(--primary);box-shadow:none}
.save-btn.ghost:active{background:var(--card2)}
.save-btn.danger{background:var(--danger);color:#fff;box-shadow:0 2px 8px rgba(229,57,53,.2)}
.save-btn.danger:active{background:#B71C1C}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;animation:fade .2s}
.sheet-bg.open{display:block}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:520px;background:var(--card);border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:10px 16px 24px;z-index:51;transition:transform .28s cubic-bezier(.2,.8,.3,1);max-height:85vh;overflow-y:auto}
.sheet.open{transform:translateX(-50%) translateY(0)}
.sheet .drag{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.sheet h3{font-size:15px;font-weight:700;margin-bottom:14px}
.sheet-opt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--radius);border:1px solid var(--border);margin-bottom:8px;cursor:pointer;background:var(--card2);transition:.15s}
.sheet-opt:active{transform:scale(.98);background:var(--border)}
.sheet-opt .ic{font-size:22px;flex-shrink:0}
.sheet-opt .txt{flex:1}
.sheet-opt .txt h4{font-size:14px;font-weight:600}
.sheet-opt .txt p{font-size:12px;color:var(--text2);margin-top:2px}
.hist-item{background:var(--card);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);margin-bottom:10px;border:1px solid var(--border);transition:.15s}
.hist-item .fecha{font-size:13px;font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.hist-item .fecha .lote{color:var(--text2);font-weight:500;font-size:12px}
.hist-line{font-size:12.5px;color:var(--text2);padding:3px 0;display:flex;gap:6px}
.hist-line .ic{flex-shrink:0}
.hist-empty{text-align:center;padding:40px 20px;color:var(--text3);font-size:14px}
.hist-empty .big{font-size:40px;margin-bottom:12px;opacity:.4}
.lote-item{background:var(--card);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);margin-bottom:10px;cursor:pointer;border:1px solid var(--border);border-left:4px solid var(--success);transition:.15s}
.lote-item:active{transform:scale(.985)}
.lote-item.warn{border-left-color:var(--warning)}
.lote-item.danger{border-left-color:var(--danger)}
.lote-item h3{font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.lote-item h3 .badge{font-size:10px;background:var(--primary);color:#fff;padding:3px 8px;border-radius:10px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
[data-theme="dark"] .lote-item h3 .badge{color:#141414}
.lote-item p{font-size:12.5px;color:var(--text2);margin-top:4px}
.lote-item .alert{font-size:12px;color:var(--danger);margin-top:6px;font-weight:600}
.setting-group{margin-bottom:20px}
.setting-group .group-title{font-size:11.5px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin:0 0 8px 4px}
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--border)}
.setting-row:first-child{border-radius:var(--radius) var(--radius) 0 0}
.setting-row:last-child{border-radius:0 0 var(--radius) var(--radius);border-bottom:none}
.setting-row .lbl{font-size:14px}
.setting-row .val{font-size:13px;color:var(--text2);display:flex;align-items:center;gap:6px}
.setting-row .val.chev::after{content:"›";font-size:18px;color:var(--text3)}
.switch{width:46px;height:26px;border-radius:13px;background:var(--border);position:relative;cursor:pointer;transition:.2s;flex-shrink:0}
.switch.on{background:var(--primary)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on::after{left:23px}
.text-input{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;width:100%;color:var(--text);font-size:15px;outline:none;transition:.15s}
.text-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(107,142,35,.12)}
.text-input::placeholder{color:var(--text3)}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:11px 20px;border-radius:22px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.28s;z-index:100;box-shadow:var(--shadow-lg);white-space:nowrap;max-width:90vw;text-overflow:ellipsis;overflow:hidden}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.calc{background:var(--card2);border-radius:var(--radius-sm);padding:10px 14px;font-size:12.5px;color:var(--text2);display:flex;justify-content:space-between;margin-bottom:16px;align-items:center}
.calc b{color:var(--primary);font-size:15px;font-variant-numeric:tabular-nums}
.collapse-head{display:flex;justify-content:space-between;align-items:center;padding:14px 0;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--primary);border-top:1px solid var(--border);margin-top:8px}
.collapse-head .arrow{transition:.2s;font-size:12px}
.collapse-head.open .arrow{transform:rotate(90deg)}
.collapse-body{display:none;padding-top:8px}
.collapse-body.open{display:block;animation:fade .2s}
.empty{text-align:center;padding:40px 20px;color:var(--text3)}
.empty .big{font-size:48px;margin-bottom:12px;opacity:.3}
.empty h3{font-size:15px;font-weight:600;color:var(--text2);margin-bottom:6px}
.empty p{font-size:13px}

/* MODAL DE INPUT */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;animation:fade .2s}
.modal-bg.open{display:flex}
.modal{background:var(--card);border-radius:16px;padding:22px 20px;max-width:400px;width:100%;animation:pop .25s ease}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.modal h3{font-size:17px;font-weight:700;margin-bottom:6px;text-align:center}
.modal p{font-size:13px;color:var(--text2);text-align:center;margin-bottom:18px}
.modal input{width:100%;padding:14px;border-radius:12px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-size:24px;font-weight:700;text-align:center;outline:none;font-variant-numeric:tabular-nums;transition:.15s}
.modal input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(107,142,35,.15)}
.modal-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.modal-btns button{padding:13px;border-radius:12px;border:none;font-size:14.5px;font-weight:600;cursor:pointer;transition:.15s}
.modal-btns .cancel{background:var(--card2);color:var(--text)}
.modal-btns .confirm{background:var(--primary);color:#fff}
[data-theme="dark"] .modal-btns .confirm{color:#141414}
.modal-btns button:active{transform:scale(.97)}

/* TUTORIAL */
.tut-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
.tut-bg.open{display:flex}
.tut{background:var(--card);border-radius:20px;padding:30px 22px 22px;max-width:380px;width:100%;text-align:center;animation:pop .3s ease;position:relative}
.tut .skip{position:absolute;top:12px;right:14px;background:none;border:none;color:var(--text2);font-size:13px;cursor:pointer;font-weight:500;padding:6px 10px;border-radius:8px}
.tut .skip:active{background:var(--card2)}
.tut .emoji{font-size:60px;margin-bottom:16px;display:block;line-height:1}
.tut h3{font-size:19px;font-weight:700;margin-bottom:10px;color:var(--text)}
.tut p{font-size:14px;color:var(--text2);line-height:1.55;margin-bottom:24px;min-height:66px}
.tut .dots{display:flex;justify-content:center;gap:6px;margin-bottom:20px}
.tut .dot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:.2s}
.tut .dot.on{background:var(--primary);width:24px;border-radius:4px}
.tut-btns{display:flex;gap:10px}
.tut-btns button{flex:1;padding:13px;border-radius:12px;border:none;font-size:14.5px;font-weight:600;cursor:pointer;transition:.15s}
.tut-btns .prev{background:var(--card2);color:var(--text)}
.tut-btns .next{background:var(--primary);color:#fff}
[data-theme="dark"] .tut-btns .next{color:#141414}
.tut-btns button:active{transform:scale(.97)}

/* TABS */
.tabs{display:flex;background:var(--card2);border-radius:12px;padding:4px;margin-bottom:16px;gap:4px}
.tab{flex:1;padding:10px;text-align:center;border-radius:8px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--text2);border:none;background:transparent;transition:.15s}
.tab.on{background:var(--card);color:var(--primary);box-shadow:var(--shadow)}
.chart-wrap{background:var(--card);border-radius:12px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px;border:1px solid var(--border)}
.chart-wrap h4{font-size:12.5px;color:var(--text2);font-weight:600;margin-bottom:10px;text-transform:uppercase;letter-spacing:.3px}
.chart-box{height:220px;position:relative}

/* FOTOS */
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.photo-item{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--card2);border:1px solid var(--border)}

<script>
/* ============================================================
   CONFIGURACIÓN DE GOOGLE DRIVE
   ============================================================ */
const GOOGLE_CLIENT_ID = '609515676507-gatfsrjmrnaiitfr2t4g9mcii6g5mvb7.apps.googleusercontent.com';
const DRIVE_FILE_NAME = 'bitacora_avicola.json';

/* ============================================================
   DEXIE - BASE DE DATOS LOCAL
   ============================================================ */
const db = new Dexie('BitacoraAvicolaDB');
db.version(1).stores({
  lotes: 'id',
  registros: '[loteId+fecha]',
  eventos: '++id',
  meta: 'key'
});

const HOY = () => new Date().toISOString().slice(0,10);

const DEFAULT_LOTES = [
  { id:'g3', nombre:'Galpón 3', etapa:'postura', semana:45, avesIniciales:1200, avesActuales:1198, linea:'Lohmann Brown' },
  { id:'g1', nombre:'Galpón 1', etapa:'recria', semana:12, avesIniciales:1500, avesActuales:1497, linea:'Hy-Line Brown' },
  { id:'g2', nombre:'Galpón 2', etapa:'postura', semana:60, avesIniciales:800, avesActuales:793, linea:'Lohmann Brown' }
];

let state = null;

async function inicializarDB(){
  const count = await db.lotes.count();
  if(count === 0){
    await db.lotes.bulkPut(DEFAULT_LOTES);
    await db.meta.put({key:'loteActual', value:'g3'});
    await db.meta.put({key:'ajustes', value:{
      dark:false, umbralMort:0.1, almacenaHuevos:true, pesoDia:1, notifActivas:false, notifHora:8
    }});
  }
}

async function cargarDesdeDexie(){
  const lotes = await db.lotes.toArray();
  const registrosArr = await db.registros.toArray();
  const eventos = await db.eventos.toArray();
  const metaArr = await db.meta.toArray();

  const registros = {};
  registrosArr.forEach(r=>{
    registros[r.loteId+'_'+r.fecha] = {
      ambiente: r.ambiente || null,
      produccion: r.produccion || null,
      sanidad: r.sanidad || null,
      bienestar: r.bienestar || null
    };
  });

  const meta = {};
  metaArr.forEach(m => meta[m.key] = m.value);

  return {
    lotes: lotes.length ? lotes : DEFAULT_LOTES,
    loteActual: meta.loteActual || 'g3',
    registros,
    eventos,
    ajustes: meta.ajustes || { dark:false, umbralMort:0.1, almacenaHuevos:true, pesoDia:1, notifActivas:false, notifHora:8 },
    tutorialVisto: meta.tutorialVisto || false,
    _lastSaved: meta._lastSaved || 0
  };
}

let saving = false, savePending = false;
async function guardarEnDexie(){
  if(saving){ savePending = true; return; }
  saving = true;
  try{
    await db.transaction('rw', db.lotes, db.registros, db.eventos, db.meta, async ()=>{
      const lotesExistentes = await db.lotes.toArray();
      const idsActuales = new Set(state.lotes.map(l=>l.id));
      for(const le of lotesExistentes){
        if(!idsActuales.has(le.id)) await db.lotes.delete(le.id);
      }
      await db.lotes.bulkPut(state.lotes);

      const regsExistentes = await db.registros.toArray();
      const keysActuales = new Set(Object.keys(state.registros));
      for(const re of regsExistentes){
        const k = re.loteId+'_'+re.fecha;
        if(!keysActuales.has(k)) await db.registros.delete([re.loteId, re.fecha]);
      }
      const regsArr = Object.entries(state.registros).map(([k,v])=>{
        const idx = k.lastIndexOf('_');
        return { loteId: k.slice(0, idx), fecha: k.slice(idx+1), ...v };
      });
      if(regsArr.length) await db.registros.bulkPut(regsArr);

      await db.eventos.clear();
      const eventosConId = state.eventos.map((e,i)=>({ ...e, id: e.id || (i+1) }));
      if(eventosConId.length) await db.eventos.bulkPut(eventosConId);

      state._lastSaved = Date.now();
      await db.meta.bulkPut([
        {key:'ajustes', value: state.ajustes},
        {key:'loteActual', value: state.loteActual},
        {key:'tutorialVisto', value: state.tutorialVisto || false},
        {key:'_lastSaved', value: state._lastSaved}
      ]);
    });
  }catch(e){ console.error('Error Dexie:', e); }
  saving = false;
  if(savePending){ savePending = false; guardarEnDexie(); }
}

function save(){
  guardarEnDexie().catch(e=>console.error(e));
  if(accessToken) scheduleDriveSync();
}

/* ============================================================
   GOOGLE DRIVE SYNC
   ============================================================ */
let tokenClient = null;
let accessToken = null;
let driveFileId = null;
let syncTimeout = null;

let googleInitIntentos = 0;

function initGoogle(){
  // Verificar si el Client ID está configurado
  if(GOOGLE_CLIENT_ID.includes('TU_CLIENT_ID')){
    document.getElementById('syncDot').title = 'Configura tu GOOGLE_CLIENT_ID';
    return;
  }

  // Si Google aún no cargó, reintentar hasta 20 veces (10 segundos)
  if(!window.google || !window.google.accounts || !window.google.accounts.oauth2){
    googleInitIntentos++;
    if(googleInitIntentos < 20){
      setTimeout(initGoogle, 500);
    } else {
      console.error('Google no cargó después de 10 segundos');
      document.getElementById('syncDot').title = 'Error al cargar Google';
      toast('Error: no se pudo cargar Google. Verifica tu conexión.');
    }
    return;
  }

  // Google ya está listo: crear el tokenClient
  try {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: 'https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/drive.file',
      callback: async (resp)=>{
        if(resp.error){ setSyncStatus('err'); return; }
        accessToken = resp.access_token;
        setSyncStatus('on');
        await sincronizar();
      }
    });
    googleInitIntentos = 0;
    console.log('Google OAuth listo');
  } catch(e){
    console.error('Error al inicializar Google:', e);
    document.getElementById('syncDot').title = 'Error al inicializar Google';
  }
}
function pedirToken(){
  if(!tokenClient){ toast('Configura GOOGLE_CLIENT_ID primero'); return; }
  setSyncStatus('syncing');
  tokenClient.requestAccessToken();
}

function setSyncStatus(s){
  const d = document.getElementById('syncDot');
  d.classList.remove('on','syncing','err');
  if(s) d.classList.add(s);
  d.title = {on:'Sincronizado', syncing:'Sincronizando...', err:'Error de sincronización'}[s] || 'Sin conectar';
}

function scheduleDriveSync(){
  clearTimeout(syncTimeout);
  syncTimeout = setTimeout(()=> sincronizar().catch(()=>{}), 3000);
}

async function driveFindFile(){
  const res = await fetch(
    `https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name='${DRIVE_FILE_NAME}'&fields=files(id,name,modifiedTime)`,
    { headers:{ Authorization:'Bearer '+accessToken } }
  );
  if(res.status===401){ accessToken=null; setSyncStatus('err'); throw new Error('Token expirado'); }
  const data = await res.json();
  return (data.files && data.files[0]) ? data.files[0] : null;
}

async function driveDownload(fileId){
  const res = await fetch(
    `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`,
    { headers:{ Authorization:'Bearer '+accessToken } }
  );
  return res.json();
}

async function driveUpload(content){
  const metadata = {
    name: DRIVE_FILE_NAME,
    parents: driveFileId ? undefined : ['appDataFolder']
  };
  const boundary = '----bitacora' + Date.now();
  const body =
    '--' + boundary + '\r\n' +
    'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
    JSON.stringify(metadata) + '\r\n' +
    '--' + boundary + '\r\n' +
    'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
    JSON.stringify(content) + '\r\n' +
    '--' + boundary + '--';

  const url = driveFileId
    ? `https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=multipart`
    : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;

  const res = await fetch(url, {
    method: driveFileId ? 'PATCH' : 'POST',
    headers:{
      Authorization:'Bearer '+accessToken,
      'Content-Type':'multipart/related; boundary='+boundary
    },
    body
  });
  if(!res.ok) throw new Error('Upload falló: '+res.status);
  return res.json();
}

async function sincronizar(){
  if(!accessToken){ pedirToken(); return; }
  setSyncStatus('syncing');
  try{
    const file = await driveFindFile();
    if(file){
      driveFileId = file.id;
      const remote = await driveDownload(file.id);
      const remoteTs = remote._lastSaved || 0;
      const localTs = state._lastSaved || 0;
      if(remoteTs > localTs){
        state = { ...remote, _lastSaved: remoteTs };
        await guardarEnDexie();
        render();
        toast('Datos actualizados desde Drive');
      } else if(localTs > remoteTs){
        await driveUpload(state);
        toast('Datos respaldados ✓');
      }
    } else {
      await driveUpload(state);
      toast('Datos respaldados por primera vez');
    }
    setSyncStatus('on');
  }catch(e){
    console.error('Sync error:', e);
    setSyncStatus('err');
    toast('Error de sincronización');
  }
}

/* ============================================================
   EXPORTAR A EXCEL
   ============================================================ */
function exportarExcel(){
  try{
    const wb = XLSX.utils.book_new();
    const regs = [];
    Object.entries(state.registros).forEach(([k,v])=>{
  // Filtrar registros completamente vacíos
  const tieneDatos = v.ambiente || v.produccion || v.sanidad || v.bienestar;
  if(!tieneDatos) return;
      const idx = k.lastIndexOf('_');
      const loteId = k.slice(0, idx);
      const fecha = k.slice(idx+1);
      const lote = state.lotes.find(l=>l.id===loteId) || {nombre:loteId};
      const row = { Fecha: fecha, Lote: lote.nombre };
      if(v.ambiente){
        Object.assign(row, {
          'T° Mín': v.ambiente.tempMin, 'T° Máx': v.ambiente.tempMax, 'T° Prom': v.ambiente.tempProm,
          'Hum Mín': v.ambiente.humMin, 'Hum Máx': v.ambiente.humMax, 'Hum Prom': v.ambiente.humProm,
          'Amoniaco': v.ambiente.amoniaco, 'Ventilación': v.ambiente.ventilacion,
          'Cama': v.ambiente.cama, 'Moscas': v.ambiente.moscas, 'Roedores': v.ambiente.roedores
        });
      }
      if(v.produccion){
        Object.assign(row, {
          'Alimento (kg)': v.produccion.alimentoKg,
          'Huevos': v.produccion.huevos,
          'No aptos': v.produccion.noAptos,
          'Peso aves (g)': v.produccion.pesoAves,
          'Peso huevo (g)': v.produccion.pesoHuevo
        });
      }
      if(v.sanidad){
        Object.assign(row, {
          'Muertas': v.sanidad.muertas,
          'Enfermas': v.sanidad.enfermas,
          'Descartadas': v.sanidad.descartadas,
          'Causa': v.sanidad.causa
        });
      }
      if(v.bienestar){
        Object.assign(row, {
          'Plumas': v.bienestar.plumas,
          'Lesiones': v.bienestar.lesiones,
          'Pododermatitis': v.bienestar.podo
        });
      }
      regs.push(row);
    });
    regs.sort((a,b)=> (b.Fecha||'').localeCompare(a.Fecha||''));
    if(regs.length){
      const ws1 = XLSX.utils.json_to_sheet(regs);
      XLSX.utils.book_append_sheet(wb, ws1, 'Registros');
    }
    if(state.eventos.length){
      const evs = state.eventos.map(e=>{
        const lote = state.lotes.find(l=>l.id===e.loteId) || {nombre:e.loteId};
        return {
          Fecha: e.fecha ? new Date(e.fecha).toLocaleString('es-MX') : '',
          Lote: lote.nombre,
          Tipo: e.tipo, Subtipo: e.subtipo,
          Producto: e.producto, Dosis: e.dosis,
          'Días retiro': e.retiro,
          Responsable: e.responsable, Motivo: e.motivo
        };
      });
      const ws2 = XLSX.utils.json_to_sheet(evs);
      XLSX.utils.book_append_sheet(wb, ws2, 'Eventos');
    }
    const resumen = state.lotes.map(l=>{
      const regsLote = Object.entries(state.registros).filter(([k])=> k.startsWith(l.id+'_'));
      const totalHuevos = regsLote.reduce((s,[,v])=> s + (v.produccion?.huevos||0), 0);
      const totalMuertas = regsLote.reduce((s,[,v])=> s + (v.sanidad?.muertas||0), 0);
      return {
        Lote: l.nombre,
        Etapa: l.etapa,
        Semana: l.semana,
        'Aves actuales': l.avesActuales,
        'Días registrados': regsLote.length,
        'Total huevos': totalHuevos,
        'Total muertas': totalMuertas,
        'Mortalidad %': l.avesIniciales ? ((totalMuertas/l.avesIniciales)*100).toFixed(2) : 0
      };
    });
    const ws3 = XLSX.utils.json_to_sheet(resumen);
    XLSX.utils.book_append_sheet(wb, ws3, 'Resumen');
    XLSX.writeFile(wb, `bitacora_${HOY()}.xlsx`);
    toast('Excel exportado ✓');
  }catch(e){ console.error(e); toast('Error al exportar'); }
}

/* ============================================================
   EXPORTAR A PDF
   ============================================================ */
function exportarPDF(){
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('p','mm','a4');
    const l = lote();
    const hoy = new Date().toLocaleDateString('es-MX');
    doc.setFontSize(18);
    doc.setTextColor(107,142,35);
    doc.text('Bitácora Avícola', 14, 20);
    doc.setFontSize(11);
    doc.setTextColor(80,80,80);
    doc.text('Reporte: ' + l.nombre, 14, 27);
    doc.text('Generado: ' + hoy, 14, 33);
    doc.text('Etapa: ' + cap(l.etapa) + ' · Semana ' + l.semana, 14, 39);
    doc.text('Aves actuales: ' + l.avesActuales + ' de ' + l.avesIniciales, 14, 45);
    const mes = new Date().toISOString().slice(0,7);
    const regs = Object.entries(state.registros)
      .filter(([k])=> k.startsWith(l.id+'_') && k.includes(mes))
      .sort();
    if(regs.length){
      const rows = regs.map(([k,v])=>[
        k.split('_')[1],
        v.ambiente?.tempProm ?? '-',
        v.ambiente?.humProm ?? '-',
        v.ambiente?.amoniaco ?? '-',
        v.produccion?.huevos ?? '-',
        v.produccion?.alimentoKg ?? '-',
        v.sanidad?.muertas ?? '-',
        v.sanidad?.enfermas ?? '-'
      ]);
      doc.autoTable({
        startY: 55,
        head: [['Fecha','T°','Hum','Amon.','Huevos','Alim.','Muert.','Enfer.']],
        body: rows, theme: 'grid',
        styles:{ fontSize: 8, cellPadding: 2 },
        headStyles:{ fillColor: [107,142,35], textColor: 255 },
        alternateRowStyles:{ fillColor: [245,245,240] }
      });
    }
    const evs = state.eventos.filter(e=> e.loteId===l.id && e.fecha && e.fecha.startsWith(mes));
    if(evs.length){
      const y = doc.lastAutoTable ? doc.lastAutoTable.finalY + 10 : 100;
      doc.setFontSize(13);
      doc.setTextColor(107,142,35);
      doc.text('Eventos del mes', 14, y);
      doc.autoTable({
        startY: y + 4,
        head: [['Fecha','Tipo','Subtipo','Producto','Dosis']],
        body: evs.map(e=>[
          (e.fecha||'').slice(0,10),
          e.tipo||'-', e.subtipo||'-',
          e.producto||'-', e.dosis||'-'
        ]),
        theme: 'grid',
        styles:{ fontSize: 8, cellPadding: 2 },
        headStyles:{ fillColor: [107,142,35], textColor: 255 }
      });
    }
    doc.save('reporte_'+l.id+'_'+mes+'.pdf');
    toast('PDF generado ✓');
  }catch(e){ console.error(e); toast('Error al generar PDF'); }
}

/* ============================================================
   HELPERS
   ============================================================ */
function lote(){ return state.lotes.find(l=>l.id===state.loteActual) || state.lotes[0]; }
function cap(s){ return s ? s.charAt(0).toUpperCase()+s.slice(1) : ''; }
function regKey(fecha, id){ return (id||state.loteActual)+'_'+(fecha||HOY()); }

function getReg(fecha, id){
  const k = regKey(fecha, id);
  if(!state.registros[k]){
    state.registros[k] = { ambiente:null, produccion:null, sanidad:null, bienestar:null };
  }
  return state.registros[k];
}
function setReg(seccion, data, fecha){
  const r = getReg(fecha);
  r[seccion] = { ...(r[seccion]||{}), ...data, _ts: Date.now() };
  save();
}

let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2000);
}

/* ============================================================
   TEMA
   ============================================================ */
function aplicarTema(){
  if(state.ajustes.dark){
    document.documentElement.setAttribute('data-theme','dark');
    document.getElementById('themeBtn').textContent = '☀️';
  } else {
    document.documentElement.removeAttribute('data-theme');
    document.getElementById('themeBtn').textContent = '🌙';
  }
}
document.getElementById('themeBtn').onclick = () => {
  state.ajustes.dark = !state.ajustes.dark;
  save(); aplicarTema();
};

/* ============================================================
   NAVEGACIÓN
   ============================================================ */
let tabActual = 'hoy';
let histTab = 'lista';

document.querySelectorAll('.nav-item').forEach(b=>{
  b.onclick = () => { tabActual = b.dataset.tab; render(); };
});

function render(){
  if(!state) return;
  document.querySelectorAll('.nav-item').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab === tabActual);
  });
  const m = document.getElementById('main');
  if(tabActual==='hoy')            m.innerHTML = viewHoy();
  else if(tabActual==='historial') m.innerHTML = viewHistorial();
  else if(tabActual==='lotes')     m.innerHTML = viewLotes();
  else if(tabActual==='ajustes')   m.innerHTML = viewAjustes();
  bindMain();
  m.scrollTop = 0;
  if(tabActual==='historial' && histTab==='graficas'){
    setTimeout(renderGraficas, 80);
  }
}

/* ============================================================
   VISTA: HOY
   ============================================================ */
function viewHoy(){
  const l = lote();
  if(!l){
    return `<div class="empty"><div class="big">🐔</div><h3>Sin lotes</h3><p>Crea un lote en la pestaña Lotes</p></div>`;
  }
  const r = getReg();
  const secciones = [
    { k:'ambiente',   ic:'🌡️', t:'Ambiente'   },
    { k:'produccion', ic:'🥚', t:'Producción' },
    { k:'sanidad',    ic:'🩺', t:'Sanidad'    },
    { k:'bienestar',  ic:'🐔', t:'Bienestar'  }
  ];
  const visibles = secciones.filter(s=>!(s.k==='produccion' && l.etapa==='recria'));
  const completas = visibles.filter(s=>r[s.k]).length;
  const total = visibles.length;

  let html = `
    <div class="lote-card" id="selLote">
      <div class="info">
        <h3><span class="dot" id="loteDot"></span>${l.nombre} ▾</h3>
        <p>${cap(l.etapa)} · Semana ${l.semana} · ${l.avesActuales} aves</p>
      </div>
      <span class="chev">›</span>
    </div>
    <div class="progress-card">
      <div class="lbl"><span>Progreso de hoy</span><b>${completas}/${total}</b></div>
      <div class="progress-bar"><span style="width:${total?(completas/total)*100:0}%"></span></div>
    </div>
  `;

  visibles.forEach(s=>{
    const data = r[s.k];
    let status='pending', icon='⏳', summary='Sin registrar';
    if(data){
      status='ok'; icon='✅';
      summary = resumenSeccion(s.k, data, l);
      if(s.k==='sanidad' && data.muertas>0 && l.avesActuales>0){
        const pct = data.muertas / l.avesActuales * 100;
        if(pct > state.ajustes.umbralMort){ status='alert'; icon='⚠️'; }
      }
    }
    html += `
      <div class="section-card ${status}" data-sec="${s.k}">
        <div class="row">
          <div class="title"><span class="ic">${s.ic}</span>${s.t}</div>
          <div class="status">${icon}</div>
        </div>
        <div class="summary">${summary}</div>
      </div>
    `;
  });

  html += `
    <div class="quick-card">
      <h4>Acciones rápidas</h4>
      <div class="quick-grid">
        <button class="quick-btn" data-q="muertas"><span class="ic">💀</span>+ Mortalidad</button>
        <button class="quick-btn" data-q="huevos"><span class="ic">🥚</span>+ Huevos</button>
        <button class="quick-btn" data-q="alimento"><span class="ic">🌾</span>+ Alimento</button>
        <button class="quick-btn" data-q="agua"><span class="ic">💧</span>+ Agua</button>
      </div>
    </div>
  `;

  const hoy = new Date().getDay();
  const recs = [];
  if(hoy === state.ajustes.pesoDia && (!r.produccion || !r.produccion.pesoAves) && l.etapa!=='recria'){
    recs.push({ id:'peso', ic:'⚖️', titulo:'Peso semanal pendiente', sub:'Toca para registrar' });
  }
  recs.push({ id:'limpieza', ic:'🧹', titulo:'Limpieza programada hoy', sub:'Registrar en Bioseguridad' });
  html += recs.map(rec=>`
    <div class="reminder" data-rem="${rec.id}">
      <span class="ic">${rec.ic}</span>
      <div class="txt"><b>${rec.titulo}</b><span>${rec.sub}</span></div>
    </div>
  `).join('');

  return html;
}

function resumenSeccion(k, d, l){
  if(k==='ambiente'){
    const p=[];
    if(d.tempProm) p.push(d.tempProm+'°C');
    if(d.humProm) p.push(d.humProm+'%');
    if(d.amoniaco) p.push('Amoniaco '+d.amoniaco);
    return p.join(' · ') || 'Registrado';
  }
  if(k==='produccion'){
    const p=[];
    if(d.huevos!=null){
      p.push(d.huevos+' huevos');
      if(l.avesActuales) p.push(Math.round(d.huevos/l.avesActuales*100)+'% postura');
    }
    return p.join(' · ') || 'Registrado';
  }
  if(k==='sanidad'){
    const p=[];
    if(d.muertas) p.push(d.muertas+' muertas');
    if(d.enfermas) p.push(d.enfermas+' enfermas');
    if(d.descartadas) p.push(d.descartadas+' descartadas');
    if(!p.length) p.push('Sin novedades');
    return p.join(' · ');
  }
  if(k==='bienestar'){
    const p=[];
    if(d.plumas) p.push('Plumas '+d.plumas);
    if(d.lesiones && d.lesiones!=='ninguna') p.push('Lesiones '+d.lesiones);
    if(!p.length) p.push('Registrado');
    return p.join(' · ');
  }
  return 'Registrado';
}

let chartsInit = {};
function renderGraficas(){
  const fechas = [], huevos = [], muertes = [], temps = [];
  for(let i=29; i>=0; i--){
    const d = new Date(); d.setDate(d.getDate() - i);
    const f = d.toISOString().slice(0,10);
    fechas.push(f.slice(5));
    const r = state.registros[state.loteActual+'_'+f] || {};
    huevos.push(r.produccion?.huevos || 0);
    muertes.push(r.sanidad?.muertas || 0);
    temps.push(r.ambiente?.tempProm || null);
  }
  const isDark = state.ajustes.dark;
  const textColor = isDark ? '#F0F0F0' : '#2D2D2D';
  const gridColor = isDark ? '#2F2F2F' : '#E5E5E0';
  const opts = {
    responsive:true, maintainAspectRatio:false,
    plugins:{legend:{display:false}},
    scales:{
      x:{ticks:{color:textColor,font:{size:9},maxRotation:0,autoSkip:true,maxTicksLimit:8},grid:{display:false}},
      y:{beginAtZero:true,ticks:{color:textColor,font:{size:10},precision:0},grid:{color:gridColor}}
    }
  };
  ['cHuevos','cMuertes','cTemp'].forEach(id=>{
    if(chartsInit[id]){ chartsInit[id].destroy(); chartsInit[id]=null; }
  });
  const ctx1 = document.getElementById('cHuevos');
  if(ctx1) chartsInit.cHuevos = new Chart(ctx1, {
    type:'line', data:{labels:fechas,datasets:[{
      data:huevos,borderColor:'#6B8E23',backgroundColor:'rgba(107,142,35,.15)',
      fill:true,tension:.3,pointRadius:2,borderWidth:2
    }]}, options:opts
  });
  const ctx2 = document.getElementById('cMuertes');
  if(ctx2) chartsInit.cMuertes = new Chart(ctx2, {
    type:'bar', data:{labels:fechas,datasets:[{
      data:muertes,backgroundColor:'#E53935',borderRadius:4

  const ctx3 = document.getElementById('cTemp');

      fill:true,tension:.3,pointRadius:2,borderWidth:2,spanGaps:true
    }]}, options:opts
  });
}

function formatFecha(f){
  const hoy = HOY();
  const ayer = new Date(Date.now()-86400000).toISOString().slice(0,10);
  if(f===hoy) return 'Hoy';
  if(f===ayer) return 'Ayer';
  const [y,m,d] = f.split('-');
  return `${d}/${m}/${y}`;
}

/* ============================================================
   ACCIONES RÁPIDAS
   ============================================================ */
async function quickAction(q){
  const config = {
    muertas:  { label:'¿Cuántas aves muertas hoy?', campo:'muertas', sec:'sanidad' },
    huevos:   { label:'¿Cuántos huevos recolectados?', campo:'huevos', sec:'produccion' },
    alimento: { label:'¿Cuántos kg de alimento?', campo:'alimentoKg', sec:'produccion' },
    agua:     { label:'Consumo de agua', campo:'aguaConsumo', sec:'ambiente', tipo:'text' }
  };
  const c = config[q];
  if(!c) return;

  if(q==='agua'){
    const val = await mostrarInput({
      titulo: '💧 Consumo de agua',
      sub: 'Escribe: normal, bajo o alto',
      tipo: 'text',
      valor: 'normal'
    });
    if(val==null || val.trim()==='') return;
    const v = val.toLowerCase();
    if(!['normal','bajo','alto'].includes(v)){ toast('Escribe normal, bajo o alto'); return; }
    const r = getReg();
    const prev = r.ambiente || {};
    setReg('ambiente', {...prev, aguaConsumo: v});
    render();
    toast('Registrado ✓');
    return;
  }

  const emoji = { muertas:'💀', huevos:'🥚', alimento:'🌾' }[q] || '';
  const val = await mostrarInput({
    titulo: emoji + ' ' + c.label,
    sub: '',
    tipo: 'number',
    valor: ''
  });
  if(val==null || val.trim()==='') return;
  const n = parseFloat(val);
  if(isNaN(n) || n<0){ toast('Número inválido'); return; }

  const r = getReg();
  const prev = r[c.sec] || {};

  if(q==='muertas'){
    const l = lote();
    l.avesActuales = Math.max(0, l.avesActuales - n);
    const acum = (prev.muertasAcum || 0) + n;
    setReg('sanidad', {...prev, muertas:(prev.muertas||0)+n, muertasAcum: acum});
  } else {
    setReg(c.sec, {...prev, [c.campo]: (prev[c.campo]||0) + n});
  }
  render();
  toast('Registrado ✓');
}

    toast('Lote: '+l.nombre);
  };
  sheet.querySelector('[data-opt="edit"]').onclick = ()=>{
    cerrarSheet();
    setTimeout(()=> abrirFormLote(l.id), 150);
  };
  sheet.querySelector('[data-opt="delete"]').onclick = ()=>{
    if(state.lotes.length<=1) return;
    if(confirm(`¿Eliminar "${l.nombre}" y TODOS sus registros?\n\nEsta acción no se puede deshacer.`)){
      Object.keys(state.registros).forEach(k=>{
        if(k.startsWith(l.id+'_')) delete state.registros[k];
      });
      state.eventos = state.eventos.filter(e=> e.loteId !== l.id);
      state.lotes = state.lotes.filter(x=> x.id !== l.id);
      if(state.loteActual === l.id){
        state.loteActual = state.lotes[0]?.id || null;
      }
      save(); cerrarSheet(); render();
      toast('Lote eliminado');
    }
  };
  abrirSheet();
}

function abrirFormLote(loteId){
  const esEdicion = !!loteId;
  const l = esEdicion ? state.lotes.find(x=>x.id===loteId) : null;
  const screen = document.getElementById('screen');
  const title  = document.getElementById('screenTitle');
  const body   = document.getElementById('screenBody');
  const action = document.getElementById('screenAction');
  action.style.display = 'none';
  title.textContent = esEdicion ? '✏️ Editar lote' : '🐔 Nuevo lote';
  body.innerHTML = `
    <div class="field">
      <label>Nombre del lote</label>
      <input type="text" class="text-input" id="fNombre" value="${l?.nombre||''}" placeholder="Ej: Galpón 4">
    </div>
    <div class="field">
      <label>Etapa</label>
      <div class="chips" id="fEtapa">
        <button type="button" class="chip ${l?.etapa==='recria'?'on':''}" data-v="recria">Recría</button>
        <button type="button" class="chip ${l?.etapa==='pre-postura'?'on':''}" data-v="pre-postura">Pre-postura</button>
        <button type="button" class="chip ${l?.etapa==='postura'?'on':''}" data-v="postura">Postura</button>
        <button type="button" class="chip ${l?.etapa==='descarte'?'on':''}" data-v="descarte">Descarte</button>
      </div>
    </div>
    <div class="field">
      <label>Línea genética / híbrido</label>
      <input type="text" class="text-input" id="fLinea" value="${l?.linea||''}" placeholder="Ej: Lohmann Brown">
    </div>
    <div class="field">
      <label>Semana de edad</label>
      <div class="input-row one"><div class="num-input"><input type="number" inputmode="numeric" id="fSemana" value="${l?.semana??''}" placeholder="1"></div></div>
    </div>
    <div class="field">
      <label>Aves iniciales</label>
      <div class="input-row one"><div class="num-input"><input type="number" inputmode="numeric" id="fAvesIni" value="${l?.avesIniciales??''}" placeholder="0"></div></div>
    </div>
    <div class="field">
      <label>Aves actuales</label>
      <div class="input-row one"><div class="num-input"><input type="number" inputmode="numeric" id="fAvesAct" value="${l?.avesActuales??''}" placeholder="0"></div></div>
    </div>
    ${esEdicion ? `
      <div class="reminder" style="margin-bottom:16px">
        <span class="ic">⚠️</span>
        <div class="txt"><b>Editar aves actuales</b><span>Cambiar este valor no borra registros, solo ajusta el conteo</span></div>
      </div>
    ` : ''}
    <button class="save-btn" id="saveLote">${esEdicion?'Guardar cambios':'Crear lote'}</button>
    ${esEdicion?`<button class="save-btn danger" id="deleteLote" style="margin-top:10px">🗑️ Eliminar este lote</button>`:''}
  `;
  body.querySelectorAll('#fEtapa .chip').forEach(c=>{
    c.onclick = ()=>{
      body.querySelectorAll('#fEtapa .chip').forEach(x=>x.classList.remove('on'));
      c.classList.add('on');
    };
  });
  document.getElementById('saveLote').onclick = ()=>{
    const nombre = document.getElementById('fNombre').value.trim();
    if(!nombre){ toast('Falta el nombre'); return; }
    const etapaOn = body.querySelector('#fEtapa .chip.on');
    const etapa = etapaOn ? etapaOn.dataset.v : 'recria';
    const linea = document.getElementById('fLinea').value.trim() || '—';
    const semana = parseInt(document.getElementById('fSemana').value) || 1;
    const avesIni = parseInt(document.getElementById('fAvesIni').value) || 0;
    const avesAct = parseInt(document.getElementById('fAvesAct').value) || avesIni;
    if(esEdicion){
      l.nombre = nombre; l.etapa = etapa; l.linea = linea;
      l.semana = semana; l.avesIniciales = avesIni; l.avesActuales = avesAct;
      toast('Lote actualizado ✓');
    } else {
      const id = 'lote_'+Date.now();
      state.lotes.push({ id, nombre, etapa, linea, semana, avesIniciales: avesIni, avesActuales: avesAct });
      state.loteActual = id;
      toast('Lote creado ✓');
    }
    save(); screen.classList.remove('open'); render();
  };
  const delBtn = document.getElementById('deleteLote');
  if(delBtn) delBtn.onclick = ()=>{
    if(state.lotes.length<=1){ toast('No puedes borrar el último lote'); return; }
    if(confirm(`¿Eliminar "${l.nombre}" y TODOS sus registros?`)){
      Object.keys(state.registros).forEach(k=>{
        if(k.startsWith(l.id+'_')) delete state.registros[k];
      });
      state.eventos = state.eventos.filter(e=> e.loteId !== l.id);
      state.lotes = state.lotes.filter(x=> x.id !== l.id);
      if(state.loteActual === l.id) state.loteActual = state.lotes[0]?.id || null;
      save(); screen.classList.remove('open'); render();
      toast('Lote eliminado');
    }
  };
  screen.classList.add('open');
}

/* ============================================================

   ============================================================ */
function abrirSeccion(k, abrirPeso){
  const screen = document.getElementById('screen');
  const title  = document.getElementById('screenTitle');
  const body   = document.getElementById('screenBody');
  const action = document.getElementById('screenAction');
  const r = getReg();
  const l = lote();
  const titles = { ambiente:'🌡️ Ambiente', produccion:'🥚 Producción', sanidad:'🩺 Sanidad', bienestar:'🐔 Bienestar' };
  title.textContent = titles[k];
  const mostrarCopiar = (k==='ambiente' || k==='produccion');
  action.style.display = mostrarCopiar ? 'block' : 'none';
  action.onclick = ()=> copiarAyer(k);

  if(k==='ambiente')        body.innerHTML = formAmbiente(r.ambiente||{});
  else if(k==='produccion') body.innerHTML = formProduccion(r.produccion||{}, l);
  else if(k==='sanidad')    body.innerHTML = formSanidad(r.sanidad||{}, l);
  else if(k==='bienestar')  body.innerHTML = formBienestar(r.bienestar||{});

  bindForm(k);
  screen.classList.add('open');
  if(abrirPeso){
    setTimeout(()=>{
      const head = body.querySelector('.collapse-head[data-col="semanal"]');
      if(head && !head.classList.contains('open')) head.click();
    }, 300);
  }
}
document.getElementById('screenBack').onclick = ()=>{
  document.getElementById('screen').classList.remove('open');

function chipsHTML(name, opts, val){
  return `<div class="chips" data-name="${name}">
    ${opts.map(o=>`<button type="button" class="chip ${val===o.v?'on':''}" data-v="${o.v}">${o.t}</button>`).join('')}
  </div>`;
}
function checksHTML(name, opts, valArr){
  valArr = valArr || [];
  return `<div class="checks" data-name="${name}">
    ${opts.map(o=>{
      const on = valArr.includes(o.v);
      return `<div class="check ${on?'on':''}" data-v="${o.v}">
        <div class="box">${on?'✓':''}</div>${o.t}
      </div>`;
    }).join('')}
  </div>`;
}

let fotosTemp = { sanidad: [], bienestar: [] };

function initFotos(sec){
  const existentes = (getReg()[sec]?.fotos) || [];
  fotosTemp[sec] = [...existentes];
  renderFotos(sec);
  const file = document.getElementById('file'+cap(sec));
  if(file) file.onchange = async (e)=>{
    const f = e.target.files[0];
    if(!f) return;
    const compressed = await comprimirImagen(f);
    fotosTemp[sec].push(compressed);
    renderFotos(sec);
    file.value = '';
  };
}

function renderFotos(sec){
  const grid = document.getElementById('fotos'+cap(sec));
  if(!grid) return;
  const fotos = fotosTemp[sec] || [];
  grid.innerHTML = fotos.map((f,i)=>`
    <div class="photo-item">

function comprimirImagen(file){
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const MAX = 800;
        let {width, height} = img;
        if(width > MAX || height > MAX){
          if(width > height){ height = Math.round(height*MAX/width); width = MAX; }
          else { width = Math.round(width*MAX/height); height = MAX; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function leerFormulario(){
  const body = document.getElementById('screenBody');
  const data = {};
  body.querySelectorAll('[data-n]').forEach(inp=>{
    const v = inp.value.trim();
    if(v==='') return;
    const n = parseFloat(v);
    data[inp.dataset.n] = isNaN(n) ? v : n;
  });
  body.querySelectorAll('.chips').forEach(group=>{
    const on = group.querySelector('.chip.on');
    if(on) data[group.dataset.name] = on.dataset.v;
  });
  body.querySelectorAll('.checks').forEach(group=>{
    const vals = [...group.querySelectorAll('.check.on')].map(x=>x.dataset.v);
    if(vals.length) data[group.dataset.name] = vals;
  });
  return data;
}

function guardarSeccion(k){
  const data = leerFormulario();
  const prev = getReg()[k] || {};
  if(k==='sanidad' || k==='bienestar'){
    data.fotos = fotosTemp[k] || [];
  }
  if(k==='sanidad'){
    const l = lote();
    const dif = (data.muertas||0) + (data.descartadas||0);
    if(!prev._aplicado && dif>0){
      l.avesActuales = Math.max(0, l.avesActuales - dif);
      data.muertasAcum = (prev.muertasAcum || 0) + (data.muertas||0);
      data._aplicado = true;
    } else {
      data.muertasAcum = prev.muertasAcum || 0;
      data._aplicado = prev._aplicado || false;
    }
  }
  setReg(k, {...prev, ...data});
  document.getElementById('screen').classList.remove('open');
  render();
  toast('Guardado ✓');
}

function copiarAyer(k){
  const ayer = new Date(Date.now()-86400000).toISOString().slice(0,10);
  const prev = state.registros[regKey(ayer)]?.[k];
  if(!prev){ toast('No hay datos de ayer'); return; }
  const body = document.getElementById('screenBody');
  body.querySelectorAll('[data-n]').forEach(inp=>{
    if(prev[inp.dataset.n]!=null) inp.value = prev[inp.dataset.n];
  });
  body.querySelectorAll('.chips').forEach(group=>{
    const name = group.dataset.name;
    if(prev[name]){
      group.querySelectorAll('.chip').forEach(c=>{
        c.classList.toggle('on', c.dataset.v===prev[name]);
      });
    }
  });
  body.querySelectorAll('.checks').forEach(group=>{
    const name = group.dataset.name;
    if(prev[name]){
      group.querySelectorAll('.check').forEach(c=>{
        const on = prev[name].includes(c.dataset.v);
        c.classList.toggle('on', on);
        c.querySelector('.box').textContent = on?'✓':'';
      });
    }
  });
  toast('Datos de ayer copiados');
}

    const blob = new Blob([JSON.stringify(state,null,2)],{type:'application/json'});

    a.href = url; a.download = 'bitacora_backup_'+HOY()+'.json'; a.click();

    const input = document.createElement('input');
    input.type = 'file'; input.accept = '.json,application/json';
    input.onchange = async ()=>{
      const file = input.files[0]; if(!file) return;
      try{
        const text = await file.text();
        const data = JSON.parse(text);
        if(!data.lotes || !data.registros){ toast('Archivo no válido'); return; }
        state = data;
        await guardarEnDexie();
        aplicarTema(); render();
        toast('Copia importada ✓');
      }catch(e){ toast('Error al importar'); }
    };
    input.click();
  }
  if(act==='tutorial'){ iniciarTutorial(true); }
   if(act==='reset'){
    if(confirm('¿Borrar TODOS los datos? Esta acción no se puede deshacer.')){
      db.delete().then(()=>{
        localStorage.removeItem('bitacora_avicola_v2');
        localStorage.removeItem('tutorialVisto');
        location.reload();
      });
    }
  }
  if(act==='sync'){
    if(accessToken) sincronizar();
    else pedirToken();
  }
  if(act==='disconnect'){
    accessToken = null;
    driveFileId = null;
    setSyncStatus(null);
    render();
    toast('Desconectado');
  }
  if(act==='editUmbral'){
    const v = prompt('Umbral mortalidad diaria (%):', state.ajustes.umbralMort);
    if(v==null) return;
    const n = parseFloat(v);
    if(isNaN(n) || n<0){ toast('Valor inválido'); return; }

    save(); render(); toast('Umbral actualizado');

  if(act==='editPesoDia'){
    const v = prompt('Día de peso semanal (0=Dom ... 6=Sáb):', state.ajustes.pesoDia);

    const n = parseInt(v);

    state.ajustes.pesoDia = n;
    save(); render(); toast('Día actualizado');
  }
  if(act==='toggleNotif'){
    if(state.ajustes.notifActivas) desactivarNotificaciones();
    else activarNotificaciones();

  if(act==='editNotifHora'){

    state.ajustes.notifHora = h;

    toast('Hora actualizada');
  }
  if(act==='testNotif'){ probarNotificacion(); }
}

async function activarNotificaciones(){
  if(!('Notification' in window)){
    toast('Este dispositivo no soporta notificaciones');
    return;
  }
  const perm = await Notification.requestPermission();
  if(perm === 'granted'){
    state.ajustes.notifActivas = true;
    state.ajustes.notifHora = state.ajustes.notifHora || 8;
    save();
    programarNotificacion();
    toast('Notificaciones activadas ✓');
    render();
  } else {
    toast('Permiso denegado');
  }
}

function desactivarNotificaciones(){
  state.ajustes.notifActivas = false;
  save();
  toast('Notificaciones desactivadas');
  render();
}

function programarNotificacion(){
  if(!state.ajustes.notifActivas) return;
  if(Notification.permission !== 'granted') return;
  const ahora = new Date();
  const hora = state.ajustes.notifHora || 8;
  const proxima = new Date();
  proxima.setHours(hora, 0, 0, 0);
  if(proxima <= ahora) proxima.setDate(proxima.getDate() + 1);
  const ms = proxima - ahora;
  state.ajustes.notifProxima = proxima.toISOString();
  save();
  clearTimeout(window._notifTimer);
  window._notifTimer = setTimeout(()=>{
    mostrarNotificacionRecordatorio();
    programarNotificacion();
  }, ms);
}

function mostrarNotificacionRecordatorio(){
  if(Notification.permission !== 'granted') return;
  const l = lote();
  const reg = getReg();
  const completas = ['ambiente','produccion','sanidad','bienestar'].filter(k=>reg[k]).length;
  if(completas < 3){
    new Notification('🐔 Bitácora Avícola', {
      body: `Aún faltan registros de hoy en ${l.nombre}. Progreso: ${completas}/4`,
      icon: 'icon.png',
      tag: 'recordatorio-diario'
    });
  }
}

function probarNotificacion(){
  if(Notification.permission !== 'granted'){
    toast('Primero activa las notificaciones');
    return;
  }
  new Notification('🐔 Bitácora Avícola', {
    body: 'Así se verán los recordatorios. ¡Todo funciona!',
    icon: 'icon.png'
  });
  toast('Notificación enviada');
}

function mostrarInput({ titulo, sub, tipo='number', valor='' }){
  return new Promise(resolve => {
    const bg = document.getElementById('modalBg');
    const title = document.getElementById('modalTitle');
    const subt = document.getElementById('modalSub');
    const input = document.getElementById('modalInput');
    const cancel = document.getElementById('modalCancel');
    const confirm = document.getElementById('modalConfirm');
    title.textContent = titulo;
    subt.textContent = sub || '';
    subt.style.display = sub ? 'block' : 'none';
    input.type = tipo;
    input.value = valor;
    input.inputMode = tipo === 'number' ? 'decimal' : 'text';
    input.style.fontSize = tipo === 'number' ? '24px' : '18px';
    bg.classList.add('open');
    setTimeout(()=>{ input.focus(); input.select(); }, 150);
    function cerrar(v){
      bg.classList.remove('open');
      cancel.onclick = null;
      confirm.onclick = null;
      input.onkeydown = null;
      resolve(v);
    }
    cancel.onclick = ()=> cerrar(null);
    confirm.onclick = ()=> cerrar(input.value.trim());
    input.onkeydown = (e)=>{
      if(e.key === 'Enter'){ e.preventDefault(); cerrar(input.value.trim()); }
      if(e.key === 'Escape'){ cerrar(null); }
    };
  });
}

let backupFolderId = null;

async function buscarOCrearCarpetaBackups(){
  // Buscar carpeta existente
  const q = encodeURIComponent("name='Bitacora Avicola Backups' and mimeType='application/vnd.google-apps.folder' and trashed=false");
  const res = await fetch(
    `https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`,
    { headers:{ Authorization:'Bearer '+accessToken } }
  );
  const data = await res.json();
  if(data.files && data.files.length > 0){
    return data.files[0].id;
  }
  // Crear la carpeta
  const createRes = await fetch('https://www.googleapis.com/drive/v3/files', {
    method: 'POST',
    headers:{
      Authorization:'Bearer '+accessToken,
      'Content-Type':'application/json'
    },
    body: JSON.stringify({
      name: 'Bitacora Avicola Backups',
      mimeType: 'application/vnd.google-apps.folder'
    })
  });
  const nueva = await createRes.json();
  return nueva.id;
}

        'Alimento (kg)': v.produccion.alimentoKg,
        'Huevos': v.produccion.huevos,
        'No aptos': v.produccion.noAptos,
        'Peso aves (g)': v.produccion.pesoAves,
        'Peso huevo (g)': v.produccion.pesoHuevo
      });
    }
    if(v.sanidad){
      Object.assign(row, {
        'Muertas': v.sanidad.muertas,
        'Enfermas': v.sanidad.enfermas,
        'Descartadas': v.sanidad.descartadas,
        'Causa': v.sanidad.causa
      });
    }
    if(v.bienestar){
      Object.assign(row, {
        'Plumas': v.bienestar.plumas,
        'Lesiones': v.bienestar.lesiones,
        'Pododermatitis': v.bienestar.podo
      });
    }
    regs.push(row);
  });
  regs.sort((a,b)=> (b.Fecha||'').localeCompare(a.Fecha||''));
  if(regs.length){
    const ws1 = XLSX.utils.json_to_sheet(regs);
    XLSX.utils.book_append_sheet(wb, ws1, 'Registros');
  }

  // Hoja: Eventos
  if(state.eventos.length){
    const evs = state.eventos.map(e=>{
      const lote = state.lotes.find(l=>l.id===e.loteId) || {nombre:e.loteId};
      return {
        Fecha: e.fecha ? new Date(e.fecha).toLocaleString('es-MX') : '',
        Lote: lote.nombre,
        Tipo: e.tipo, Subtipo: e.subtipo,
        Producto: e.producto, Dosis: e.dosis,
        'Días retiro': e.retiro,
        Responsable: e.responsable, Motivo: e.motivo
      };
    });
    const ws2 = XLSX.utils.json_to_sheet(evs);
    XLSX.utils.book_append_sheet(wb, ws2, 'Eventos');
  }

  // Hoja: Resumen
  const resumen = state.lotes.map(l=>{
    const regsLote = Object.entries(state.registros).filter(([k])=> k.startsWith(l.id+'_'));
    const totalHuevos = regsLote.reduce((s,[,v])=> s + (v.produccion?.huevos||0), 0);
    const totalMuertas = regsLote.reduce((s,[,v])=> s + (v.sanidad?.muertas||0), 0);
    return {
      Lote: l.nombre,
      Etapa: l.etapa,
      Semana: l.semana,
      'Aves actuales': l.avesActuales,
      'Días registrados': regsLote.length,
      'Total huevos': totalHuevos,
      'Total muertas': totalMuertas,
      'Mortalidad %': l.avesIniciales ? ((totalMuertas/l.avesIniciales)*100).toFixed(2) : 0
    };
  });
  const ws3 = XLSX.utils.json_to_sheet(resumen);
  XLSX.utils.book_append_sheet(wb, ws3, 'Resumen');

  // Convertir a base64
  const wbout = XLSX.write(wb, { bookType:'xlsx', type:'base64' });
  return wbout;
}

async function exportarExcelADrive(){
  if(!accessToken){
    toast('Primero conecta con Google Drive');
    return;
  }
  setSyncStatus('syncing');
  try{
    // 1. Generar el Excel
    const base64 = generarExcelBlob();

    // 2. Buscar/crear carpeta
    if(!backupFolderId){
      backupFolderId = await buscarOCrearCarpetaBackups();
    }

    // 3. Subir el archivo
    const nombreArchivo = `bitacora_${HOY()}.xlsx`;
    const metadata = {
      name: nombreArchivo,
      mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
      parents: [backupFolderId]
    };

    const boundary = '----bitacora_xlsx_' + Date.now();
    const body =
      '--' + boundary + '\r\n' +
      'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
      JSON.stringify(metadata) + '\r\n' +
      '--' + boundary + '\r\n' +
      'Content-Type: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\r\n' +
      'Content-Transfer-Encoding: base64\r\n\r\n' +
      base64 + '\r\n' +
      '--' + boundary + '--';

    const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
      method: 'POST',
      headers:{
        Authorization: 'Bearer ' + accessToken,
        'Content-Type': 'multipart/related; boundary=' + boundary
      },
      body: body
    });

    if(!res.ok){
      const err = await res.text();
      throw new Error('Upload falló: ' + res.status + ' - ' + err);
    }

    setSyncStatus('on');
    toast('📤 Excel respaldado en Drive ✓');
    state.ajustes.ultimoBackupDrive = new Date().toISOString();
    save();
  }catch(e){
    console.error('Error backup:', e);
    setSyncStatus('err');
    toast('Error al respaldar en Drive');
  }
}
/* ============================================================
   SERVICE WORKER con auto-actualización
   ============================================================ */
if('serviceWorker' in navigator){
  let refreshing = false;
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.update();
      reg.addEventListener('updatefound', () => {
        const newWorker = reg.installing;
        if(!newWorker) return;
        newWorker.addEventListener('statechange', () => {
          if(newWorker.state === 'installed' && navigator.serviceWorker.controller){
            mostrarAvisoActualizacion(newWorker);
          }
        });
      });
    }).catch(err => console.log('SW error', err));
  });
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(!refreshing){
      refreshing = true;
      window.location.reload();
    }
  });
  function mostrarAvisoActualizacion(worker){
    const previo = document.getElementById('updateBanner');
    if(previo) previo.remove();
    const banner = document.createElement('div');
    banner.id = 'updateBanner';
    banner.innerHTML = `
      <div style="position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:#6B8E23;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;z-index:9999;box-shadow:0 2px 12px rgba(0,0,0,.25);font-family:inherit;font-size:13.5px;font-weight:500;animation:slideDown .3s ease;">
        <span>🎉 Hay una actualización disponible</span>
        <div style="display:flex;gap:8px">
          <button id="updateNow" style="background:#fff;color:#6B8E23;border:none;border-radius:8px;padding:7px 14px;font-size:12.5px;font-weight:700;cursor:pointer;">Actualizar</button>
          <button id="updateLater" style="background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:8px;padding:7px 12px;font-size:12.5px;cursor:pointer;">Después</button>
        </div>
      </div>
      <style>@keyframes slideDown{from{transform:translateX(-50%) translateY(-100%);}to{transform:translateX(-50%) translateY(0);}}</style>
    `;
    document.body.appendChild(banner);
    document.getElementById('updateNow').onclick = () => {
      worker.postMessage({type: 'SKIP_WAITING'});
      banner.remove();
    };
    document.getElementById('updateLater').onclick = () => { banner.remove(); };
  }
}
